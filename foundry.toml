[profile.default]
src = 'workflows'
test = 'workflows'
script = 'workflows'
out = 'out'
libs = ['lib']
solc = '0.8.28'
optimizer = true
optimizer_runs = 200
remappings = []
fs_permissions = [{access = "write", path = "./reports"}]
ffi = true
evm_version = 'cancun'

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
avalanche = "https://avax-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
polygon = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
gnosis = "https://gnosis-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
bnb = "https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
scroll = "https://scroll-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
avalanche = { key = "${ETHERSCAN_API_KEY}", chain = 43114 }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
base = { key = "${ETHERSCAN_API_KEY}", chainId = 8453 }
gnosis = { key = "${ETHERSCAN_API_KEY}", chainId = 100 }
bnb = { key = "${ETHERSCAN_API_KEY}", chainId = 56, url = 'https://api.bscscan.com/api' }
scroll = { key = "${ETHERSCAN_API_KEY}", chainId = 534352 }
